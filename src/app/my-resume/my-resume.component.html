<div class="container mt-5 pt-3 mb-5">
    <div class="text-center mb-5 anim-item-1">
        <h2 class="display-4 fw-bolder">
            My <span class="text-gradient">Resume</span>
        </h2>
        <div class="mx-auto mt-3 gradient-divider"></div>
        <p class="lead opacity-75 mt-4" style="font-weight: 300;">My professional journey and academic background.</p>
        <div class="d-flex justify-content-center gap-3 flex-wrap mt-4">
            <a class="btn btn-primary rounded-pill px-4" [href]="pdfPath" download="Venkatesh_K_Resume.pdf">
                <i class="bi bi-download me-2"></i>Download PDF
            </a>
            <a class="btn btn-outline-light rounded-pill px-4" [href]="pdfPath" target="_blank" rel="noopener">
                <i class="bi bi-box-arrow-up-right me-2"></i>Open in new tab
            </a>
        </div>
    </div>

    <div class="pdf-frame anim-item-2">
        <iframe [src]="viewerUrl" title="Venkatesh K Resume"></iframe>
    </div>
</div>
