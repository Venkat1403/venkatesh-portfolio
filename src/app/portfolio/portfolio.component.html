<div class="container mt-4">
    <div class="text-center mb-5">
        <h2 class="display-4 fw-bolder" style="font-family: 'Outfit', sans-serif;">My <span class="text-gradient">Portfolio</span></h2>
        <p class="lead opacity-75">Explore some of my recent work and projects.</p>
    </div>
    
    <div class="row row-cols-1 row-cols-md-2 row-cols-xl-3 g-4">
        @for (item of project; track item.id) {
            <div class="col d-flex justify-content-center">
                <app-project-card [project]="item" class="w-100 d-flex justify-content-center"></app-project-card>
            </div>
        } @empty {
            <div class="col-12 text-center py-5">
                <div class="glass-panel p-5 d-inline-block">
                    <h4 class="mb-3"><i class="bi bi-tools text-primary me-2"></i>Projects in Progress</h4>
                    <p class="opacity-75 mb-0">I'm currently curating my best work. Check back soon for exciting projects!</p>
                </div>
            </div>
        }
    </div>
</div>
