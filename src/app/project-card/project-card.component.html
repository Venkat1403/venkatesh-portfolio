<div class="card glass-panel text-center h-100" style="max-width:350px; min-width:350px; border: none;">
    <div class="card-body d-flex flex-column">
        <h5 class="card-title fw-bold text-gradient mb-3">{{project.name}}</h5>
        <p class="card-text opacity-75 flex-grow-1">{{project.summary}}</p>
        <button class="btn custom-btn rounded-pill mt-3 w-75 mx-auto">View More</button>
    </div>

    <div class="card-footer bg-transparent border-top border-secondary opacity-50 py-3">
        <div class="d-flex flex-wrap justify-content-center gap-2">
            @for (item of project.tags; track item) {
                <div class="badge rounded-pill px-3 py-2 fw-normal" [style.background-color]="item.color" style="opacity: 0.9;">{{item}}</div>
            }
        </div>
    </div>
</div>
